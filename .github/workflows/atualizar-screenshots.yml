name: Atualizar screenshots dos projetos

on:
  schedule:
    # Todo domingo às 06:00 UTC (03:00 no Brasil).
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Capturar screenshots
        run: npm run screenshots

      - name: Commit e push das screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/project-*.webp
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nas screenshots."
          else
            git commit -m "chore: atualiza screenshots dos projetos"
            git push
          fi
